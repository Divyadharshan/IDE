<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/ace/1.4.14/theme-monokai.min.css">
    <link rel="shortcut icon" href="https://cdn-icons-png.flaticon.com/64/17359/17359096.png" type="image/x-icon">
    <title>Online IDE</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: grey;
            margin: 0;
            padding: 0;
        }

        h1 {
            color: #333;
            margin-top: 20px;
        }

        h2 {
            text-align: center;
        }

        form {
            display: inline-block;
            text-align: left;
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            margin-top: 20px;
            max-width: 100%;
            width: 100%;
            box-sizing: border-box;
        }

        textarea {
            width: 100%;
            font-family: sans-serif;
            border: 1px solid #ccc;
            border-radius: 5px;
            margin-bottom: 10px;
            font-size: 15px;
            box-sizing: border-box;
        }

        select,
        input[type="radio"],
        input[type="submit"] {
            margin-top: 10px;
        }

        label {
            margin-right: 10px;
        }

        input[type="submit"] {
            padding: 10px 20px;
            background: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        input[type="submit"]:hover {
            background: #0056b3;
        }

        #editor {
            height: 300px;
            width: 100%;
            font-size: 18px;
        }

        .opts {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        .inp,
        .out {
            width: 100%;
            margin-top: 10px;
        }

        .inp h3,
        .out h3 {
            margin-bottom: 10px;
        }

        [name="myform"] {
            width: 90%;
            background-color: #f9fcff;
            background-image: linear-gradient(147deg, #f9fcff 0%, #dee4ea 74%);
            margin-bottom: 20px;
        }

        @media (min-width: 768px) {
            #editor {
                height: 500px;
                width: 100%;
            }

            .opts {
                flex-direction: row;
                justify-content: space-evenly;
            }

            .editor-container {
                display: flex;
                flex-direction: row;
                gap: 20px;
            }

            .inp,
            .out {
                margin-top: 0;
            }

            .inp,.out textarea {
                height: 200px;
            }
        }
    </style>
</head>

<body>
    <h1 style="color:#000000;font-weight:800;">Online IDE</h1>
    <form id="myform" name="myform" method="post" action="/compilecode">
        <div align="right" class="dropdown_container">
            <label for="theme_select">Choose a theme:</label>
            <select id="theme_select" name="theme_select">
                <option value="monokai" selected>Monokai</option>
                <option value="github">GitHub</option>
                <option value="github_dark">Github Dark</option>
                <option value="twilight">Twilight</option>
                <option value="xcode">Xcode</option>
                <option value="solarized_light">Solarized Light</option>
                <option value="solarized_dark">Solarized Dark</option>
                <option value="ambiance">Ambiance</option>
                <option value="merbivore">Merbivore</option>
                <option value="terminal">Terminal</option>
            </select>
        </div>
        <h2 style="color:#000000;font-weight:800;">Code</h2>
        <div class="opts">
            <div class="dropdown_container">
                <label for="lang">Choose a language:</label>
                <select id="lang" name="lang">
                    <option value="Python">Python</option>
                    <option value="C">C</option>
                    <option value="C++">C++</option>
                    <option value="Java">Java</option>
                    <option value="JavaScript">JavaScript</option>
                </select>
            </div>
        </div>
        <hr>
        <div class="editor-container">
            <div id="editor" name="code"></div>
            <div class="input-output-container">
                <div class="inp">
                    <h3>Input:</h3>
                    <textarea rows="11" cols="100" id="input" name="input"></textarea>
                </div>
                <br>
                <div class="out">
                    <h3>Output:</h3>
                    <textarea name="output" id="output" rows="11" cols="100"></textarea>
                </div>
            </div>
        </div>
        <center>
            <div>
                <br>
                <label>Compile with Input:</label>
                <label>
                    <input type="radio" name="inputRadio" id="inputRadioYes" value="true"> Yes
                </label>
                <label>
                    <input type="radio" name="inputRadio" id="inputRadioNo" value="false" checked> No
                </label>
            </div>
            <input type="submit" value="Run" name="submit">
            <hr>
        </center>
    </form>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.4.14/ace.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.4.14/ext-language_tools.js"></script>
    <script>
        let editor = ace.edit("editor");
        editor.setTheme("ace/theme/monokai");
        editor.session.setMode("ace/mode/python");
        editor.setValue(`#Your Python code here\nprint("Hello world!")`);

        editor.setOptions({
            enableBasicAutocompletion: true,
            enableLiveAutocompletion: true,
            autoScrollEditorIntoView: true,
        });

        const templates = {
            "C++": `#include <iostream>\nusing namespace std;\n\nint main() {\n    //Your C++ code here\n    cout<<"Hello world!";\n\n    return 0;\n}`,
            "C": `#include <stdio.h>\n\nint main() {\n    //Your C code here\n    printf("Hello world!");\n\n    return 0;\n}`,
            "Python": `#Your Python code here\nprint("Hello world!")`,
            "Java": `public class Main {\n    public static void main(String[] args) {\n        //Your Java code here\n        System.out.println("Hello world!")    \n    }\n}`,
            "JavaScript": `//Your JavaScript code here` + `\nconsole.log('Your JavaScript code here');`
        };

        const languageMap = {
            "Python": "python",
            "C": "c_cpp",
            "C++": "c_cpp",
            "Java": "java",
            "JavaScript": "javascript"
        };

        const changeLang = document.querySelector("#lang");
        const themeSelect = document.querySelector("#theme_select");
        const form = document.querySelector("#myform");

        changeLang.addEventListener("change", function () {
            const selectedLang = this.value;
            editor.session.setMode(`ace/mode/${languageMap[selectedLang]}`);
            editor.setValue(templates[selectedLang] || "");
        });

        themeSelect.addEventListener("change", function () {
            editor.setTheme(`ace/theme/${this.value}`);
        });

        form.addEventListener("submit", async function (e) {
            e.preventDefault();

            const code = editor.getValue();
            const input = document.querySelector("#input").value;
            const lang = document.querySelector("#lang").value;
            const useInput = document.querySelector("#inputRadioYes").checked;

            document.querySelector("#output").value = "Compiling ⚙️";

            try {
                const response = await fetch("/compilecode", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ code, input: useInput ? input : "", lang })
                });

                const result = await response.json();
                document.querySelector("#output").value = result.output || "Execution failed!";
            } catch (error) {
                document.querySelector("#output").value = "Error: " + error.message;
            }
        });

    </script>
</body>

</html>
